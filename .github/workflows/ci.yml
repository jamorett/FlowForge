name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install uv
          uv sync --extra dev || pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check . || ruff check .
      - name: Unit tests
        run: uv run pytest tests/unit tests/agents -q || pytest tests/unit tests/agents -q
      - name: Synthetic data smoke (no network)
        run: uv run python scripts/download_data.py --synthetic-fallback || python scripts/download_data.py --synthetic-fallback
