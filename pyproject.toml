[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "Agent research groups against a local OpenFOAM farm"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.12.0",
    "sympy>=1.12",
    "scikit-learn>=1.4.0",
    "foamlib>=0.4.0",
    "zarr>=2.17.0,<3.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "tenacity>=8.2.3",
    "openai>=1.14.0",
    "pyvista>=0.43.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
